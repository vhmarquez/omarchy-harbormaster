[package]
name = "harbormaster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first Harbormaster CLI foundation"
publish = false

[dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket", "signal"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "limits", "modern_sqlite"] }
rustix = { version = "=1.1.4", features = ["fs", "process", "rand", "event"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
