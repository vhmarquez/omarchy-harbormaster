<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160"><title>Harbormaster annotated desktop mockup</title><rect x="0" y="0" width="1440" height="1160" rx="0" fill="#13141c"/><rect x="32" y="30" width="32" height="32" rx="3" fill="#1a1b26" stroke="#7aa2f7"/><text x="40" y="53" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="22">H</text><text x="79" y="48" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="22">Harbormaster</text><text x="79" y="68" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="10">DESKTOP AGENT MANAGER</text><text x="990" y="44" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">DESIGN STUDY / 03</text><text x="990" y="65" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Fictitious data · no integrations</text><path d="M32 86H1408" stroke="#414868"/><text x="32" y="124" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="21">03 / Attention-first queue</text><text x="32" y="151" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Promote the next action. Separate responding, restoring visibility and reviewing.</text><text x="32" y="207" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">A / ONE GLOBAL ATTENTION POPUP</text><text x="32" y="235" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="13">The bar badge counts sessions needing intervention. The popup prioritizes pending</text><text x="32" y="258" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="13">decisions and lost connections, with harness, checkout and freshness kept close to each</text><text x="32" y="281" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="13">task.</text><text x="32" y="331" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Same session, same identity, on both surfaces.</text><text x="32" y="355" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Selecting an entry reveals it in the manager. Approvals stay in the native agent terminal.</text><rect x="982" y="183" width="426" height="30" rx="0" fill="#1a1b26" stroke="#414868"/><text x="994" y="203" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">1   2   3</text><text x="1136" y="203" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Sat 09:41</text><rect x="1264" y="186" width="138" height="24" rx="0" fill="#292e42"/><text x="1275" y="203" fill="#e0af68" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">H  3 need you</text><rect x="1014" y="220" width="394" height="230" rx="0" fill="#1a1b26" stroke="#414868"/><text x="1026" y="243" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">H  Harbormaster</text><text x="1299" y="243" fill="#e0af68" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Needs you</text><path d="M1014 255H1408" stroke="#414868"/><text x="1026" y="274" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Repair cache invalidation</text><text x="1362" y="274" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">12s</text><text x="1026" y="290" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="10">Claude Code · Atlas/fix/cache-key · Managed</text><text x="1026" y="305" fill="#e0af68" font-family="JetBrains Mono Nerd Font, monospace" font-size="10">◇ Waiting for approval</text><text x="1026" y="326" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Normalize import paths</text><text x="1362" y="326" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">46s</text><text x="1026" y="342" fill="#a9b1d6" font-family="JetBrains Mono 