ont, monospace" font-size="12">~/Projects/atlas · main  ▾</text><rect x="768" y="647" width="616" height="134" rx="0" fill="#202331"/><rect x="768" y="647" width="2" height="134" rx="0" fill="#e0af68"/><text x="782" y="671" fill="#e0af68" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">! Concurrent editing risk</text><text x="782" y="695" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">“Index documentation” (Hermes) is working here. Changes may overlap. Use a new</text><text x="782" y="715" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">worktree for isolation.</text><rect x="782" y="750" width="15" height="15" rx="2" fill="#1a1b26" stroke="#414868"/><text x="809" y="763" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">I understand; use the shared checkout</text><path d="M744 806H1408" stroke="#414868"/><rect x="768" y="828" width="95" height="30" rx="3" fill="#1a1b26" stroke="#414868"/><text x="778" y="848" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Cancel</text><rect x="1028" y="828" width="356" height="30" rx="3" fill="#1a1b26" stroke="#414868"/><text x="1038" y="848" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Create session &amp; open terminal</text><text x="756" y="916" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">A / ACKNOWLEDGMENT REQUIRED</text><text x="756" y="942" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">The final action remains unavailable until the user acknowledges the collision or</text><text x="756" y="963" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">chooses New worktree.</text><text x="32" y="1020" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">PROTOTYPE ONLY · No processes, worktrees or branches are created.</text></svg>