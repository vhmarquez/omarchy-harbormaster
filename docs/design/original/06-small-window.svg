nd respond to the request inside Claude Code.</text><text x="46" y="861" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Atlas / fix/cache-key · ~/Projects/atlas-cache</text><text x="46" y="887" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Managed · last seen 12s ago · snapshot 09:41</text><rect x="46" y="909" width="134" height="30" rx="3" fill="#292e42" stroke="#7aa2f7"/><text x="56" y="929" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Open terminal</text><rect x="188" y="909" width="75" height="30" rx="3" fill="#1a1b26" stroke="#414868"/><text x="198" y="929" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Attach</text><rect x="271" y="909" width="75" height="30" rx="3" fill="#1a1b26" stroke="#414868"/><text x="281" y="929" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Resume</text><rect x="354" y="909" width="126" height="30" rx="3" fill="#1a1b26" stroke="#414868"/><text x="364" y="929" fill="#c0caf5" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Open project</text><text x="46" y="968" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">Resume unavailable: this session is already live.</text><path d="M32 992H652" stroke="#414868"/><text x="46" y="1017" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="10">J K select · T terminal · A attach · R resume · P project</text><text x="704" y="218" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">A / WRAP NAVIGATION</text><text x="704" y="246" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Views and project scope become compact rows.</text><text x="704" y="268" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Filtering and New session remain visible.</text><text x="704" y="414" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">B / KEEP IDENTITY</text><text x="704" y="442" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Task, status, harness, checkout, ownership and</text><text x="704" y="464" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">freshness wrap without disappearing.</text><text x="704" y="635" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">C / STACK THE INSPECTOR</text><text x="704" y="663" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">Detail follows the selected row. All four</text><text x="704" y="685" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">session actions remain available in the</text><text x="704" y="707" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">compact layout.</text><text x="704" y="853" fill="#7aa2f7" font-family="JetBrains Mono Nerd Font, monospace" font-size="11">D / FOCUS + SELECTION</text><text x="704" y="881" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">The blue outer outline indicates keyboard</text><text x="704" y="903" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">focus; the tinted row indicates selection. Tab</text><text x="704" y="925" fill="#a9b1d6" font-family="JetBrains Mono Nerd Font, monospace" font-size="12">reaches actions; J/K moves between sessions.</text></svg>