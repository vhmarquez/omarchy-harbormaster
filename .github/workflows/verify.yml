{
  "name": "verify",
  "on": {
    "pull_request": {},
    "push": {
      "branches": ["main", "feat/**", "fix/**", "docs/**", "chore/**"]
    }
  },
  "permissions": {"contents": "read"},
  "concurrency": {
    "group": "verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "name": "verify",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {"contents": "read"},
      "steps": [
        {
          "name": "Checkout (actions/checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1,
            "fetch-tags": false,
            "submodules": false,
            "lfs": false,
            "set-safe-directory": false,
            "allow-unsafe-pr-checkout": false
          }
        },
        {
          "name": "Prepare public tools; verify offline in the pinned container",
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\nbootstrap_home=$(mktemp -d)\ntrap 'rm -rf -- \"$bootstrap_home\"' EXIT\nmkdir -p \"$bootstrap_home/docker\"\nenv -i PATH=/usr/bin:/bin HOME=\"$bootstrap_home\" DOCKER_CONFIG=\"$bootstrap_home/docker\" docker build --platform linux/amd64 --pull=false --no-cache --network=default --iidfile \"$bootstrap_home/image.id\" --file tools/ci.Dockerfile tools\nimage=$(<\"$bootstrap_home/image.id\")\n[[ \"$image\" =~ ^sha256:[0-9a-f]{64}$ ]]\nenv -i PATH=/usr/bin:/bin HOME=\"$bootstrap_home\" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 python3 scripts/prepare-tools.py --online --tools-root .tools\nenv -i PATH=/usr/bin:/bin HOME=\"$bootstrap_home\" DOCKER_CONFIG=\"$bootstrap_home/docker\" python3 scripts/verify.py --backend docker --image \"$image\""
        },
        {
          "name": "Upload bounded reports (actions/upload-artifact v7.0.1)",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "verification-reports",
            "path": ".verify/**",
            "retention-days": 7,
            "if-no-files-found": "warn",
            "include-hidden-files": true,
            "overwrite": false,
            "archive": true,
            "compression-level": 6
          }
        }
      ]
    }
  }
}
